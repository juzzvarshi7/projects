name: principal_scheduler
description: Principal Scheduler Flutter App
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.5
  path_provider: ^2.0.14
  google_fonts: ^6.1.0
  intl: ^0.19.0
  firebase_core: ^2.12.0
  cloud_firestore: ^4.9.0
  firebase_messaging: ^14.7.0
  flutter_local_notifications: ^14.0.0
  flutter_tts: ^4.4.0
  shared_preferences: ^2.1.1
  sqflite: ^2.3.0
  path: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/data.json
    - assets/college_logo.jpeg
    - assets/app_icon.png
    - assets/icons/app_icon_foreground.svg
